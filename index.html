<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAK Casino</title>
    <meta name="description" content="Welcome to HAK Casino! The best HAK Steyr Casino games.">
    <meta name="keywords"
        content="HAK Casino, HAK Steyr, Casino Games, HAK-Slots, HAK-Chicken, HAK-Blackjack, HAK-Stonks">
    <link rel="icon" href="media/favicon.avif" type="image/avif">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: #eee;
            background-image: url('media/background.avif');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100svh;
            padding: 2rem;
        }

        .container {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px) saturate(180%);
            -webkit-backdrop-filter: blur(10px) saturate(180%);
            border-radius: 15px;
            padding: 2rem 2.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 1200px;
            width: 95%;
            text-align: center;
            overflow-y: auto;
            max-height: 90svh;
        }

        .game-cards {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: 1fr;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .card img {
            width: 100%;
            object-fit: cover;
            display: block;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-content {
            padding: 1rem 1.2rem;
            text-align: left;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .game-description {
            font-size: 0.9rem;
            color: #ccc;
        }

        @media (min-width: 600px) {
            .container {
                width: 90%;
                padding: 2.5rem 3rem;
            }

            .game-cards {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }

            .site-title {
                font-size: 3rem;
            }
        }

        @media (min-width: 992px) {
            .container {
                width: 85%;
            }

            .game-cards {
                grid-template-columns: repeat(4, 1fr);
            }

            .site-title {
                font-size: 3.5rem;
            }
        }

        @media (min-width: 1200px) {
            .container {
                width: 80%;
                max-width: 1100px;
            }

            .game-cards {
                gap: 2.5rem;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="game-cards">

            <a href="./HAK-Slots" target="_blank" class="card">
                <img src="media/slots.avif" alt="HAK-Slots Game Preview">
                <div class="card-content">
                    <h2 class="game-title">HAK-Slots</h2>
                    <p class="game-description">Spielen Sie Slots und versuchen Sie Ihr Glück! Das neueste Spiel von HAK
                        Casino!</p>
                </div>
            </a>

            <a href="./HAK-Chicken" target="_blank" class="card">
                <img src="media/chicken.avif" alt="HAK-Chicken Game Preview">
                <div class="card-content">
                    <h2 class="game-title">HAK-Chicken</h2>
                    <p class="game-description">Führe das Huhn sicher über die Straße!</p>
                </div>
            </a>

            <a href="./HAK-Blackjack" target="_blank" class="card">
                <img src="media/blackjack.avif" alt="HAK-Blackjack Game Preview">
                <div class="card-content">
                    <h2 class="game-title">HAK-Blackjack</h2>
                    <p class="game-description">Schlagen Sie den Dealer, zielen Sie auf 21!</p>
                </div>
            </a>

            <a href="./HAK-Stonks" target="_blank" class="card">
                <img src="media/stonks.avif" alt="HAK-Stonks Game Preview">
                <div class="card-content">
                    <h2 class="game-title">HAK-Stonks</h2>
                    <p class="game-description">Lassen Sie die Kugel fallen!</p>
                </div>
            </a>

        </div>
    </main>

</body>

</html>
